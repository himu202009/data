<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#0d9488">
    <title>Login · Student Profiles</title>

    <!-- Runs before paint so a returning logged-in visitor never sees the login form flash -->
    <script>
        (function () {
            try {
                var authed = sessionStorage.getItem('sp_authenticated') === 'true' ||
                             localStorage.getItem('sp_authenticated') === 'true';
                if (authed) { window.location.replace('index.html'); }
            } catch (e) {}
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Same design tokens as the main site -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="login-body">

    <button
        id="theme-toggle"
        class="theme-toggle login-theme-toggle"
        type="button"
        aria-label="Switch to dark mode"
        aria-pressed="false"
        title="Toggle dark / light mode"
    >
        <span class="theme-icon" aria-hidden="true">🌙</span>
    </button>

    <main class="login-shell">
        <div class="login-card">

            <div class="lock-badge" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                    <rect x="5" y="11" width="14" height="9" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M8 11V7.5a4 4 0 0 1 8 0V11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="12" cy="15.3" r="1.4" fill="currentColor"/>
                </svg>
            </div>

            <h1 id="login-heading">Welcome back</h1>
            <p id="login-subtitle" class="login-subtitle">Enter the access password to view student profiles.</p>

            <form id="login-form" novalidate>
                <label for="password-input" class="visually-hidden">Password</label>
                <div class="password-field" id="password-field">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <rect x="5" y="11" width="14" height="9" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
                        <path d="M8 11V7.5a4 4 0 0 1 8 0V11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                    <input
                        type="password"
                        id="password-input"
                        placeholder="Password"
                        autocomplete="current-password"
                        aria-describedby="login-error"
                    >
                    <button type="button" id="toggle-password" class="toggle-password" aria-label="Show password" aria-pressed="false">
                        <svg class="eye-open" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.8"/>
                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
                        </svg>
                        <svg class="eye-closed" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M3 3l18 18M10.6 10.7a3 3 0 0 0 4.2 4.2M6.5 6.7C4.2 8.2 2 12 2 12s3.6 7 10 7c1.8 0 3.3-.5 4.6-1.2M9.9 4.2A10.6 10.6 0 0 1 12 4c6.4 0 10 7 10 7-.5 1-1.3 2.2-2.3 3.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>

                <p id="login-error" class="login-error" role="alert" aria-live="assertive"></p>

                <label class="remember-row" for="remember-me">
                    <input type="checkbox" id="remember-me">
                    <span id="remember-me-label">Keep me signed in on this device</span>
                </label>

                <button type="submit" id="login-submit" class="login-submit">
                    <span id="login-submit-label">Unlock profiles</span>
                </button>
            </form>

            <p class="login-footer">Protected access · contact an admin if you don't have the password</p>
        </div>
    </main>

    <script src="config.js" defer></script>
    <script src="login.js" defer></script>
</body>
</html>
