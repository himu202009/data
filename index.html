<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#0d9488">
    <title>Student Profiles</title>

    <!-- Auth guard: runs before paint. Sends anyone who hasn't logged
         in on login.html back there. Login itself is handled by
         login.html / login.js, with the password set in config.js. -->
    <script>
        (function () {
            try {
                var authed = sessionStorage.getItem('sp_authenticated') === 'true' ||
                             localStorage.getItem('sp_authenticated') === 'true';
                if (!authed) { window.location.replace('login.html'); }
            } catch (e) {}
        })();
    </script>

    <!-- Preconnect + font: a single font family keeps the page fast -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Preload the data file so it starts downloading immediately -->
    <link rel="preload" href="students.json" as="fetch" type="application/json" crossorigin>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-bar">
        <h1 id="page-heading">Student Profiles</h1>
        <button
            id="logout-btn"
            class="theme-toggle logout-btn"
            type="button"
            aria-label="Log out"
            title="Log out"
        >
            <span aria-hidden="true">⏻</span>
        </button>
        <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            aria-label="Switch to dark mode"
            aria-pressed="false"
            title="Toggle dark / light mode"
        >
            <span class="theme-icon" aria-hidden="true">🌙</span>
        </button>
    </header>

    <!-- Universal Search Box -->
    <div class="search-container">
        <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
                <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <input
                type="search"
                id="search-input"
                placeholder="Search by Name, ID, Institution, Phone, Batch..."
                aria-label="Search students"
                autocomplete="off"
            >
        </div>
        <p id="results-count" class="results-count" aria-live="polite"></p>
    </div>

    <!-- Student Cards Grid -->
    <main>
        <div id="student-grid" class="grid-container" aria-live="polite">
            <p class="status-message">Loading students…</p>
        </div>

        <!-- Dynamic Pagination Container -->
        <nav id="pagination" class="pagination-container" aria-label="Pagination"></nav>
    </main>

    <!-- Modal Popup Details -->
    <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-name">
        <div class="modal-content">
            <span class="close-btn" id="modal-close-btn" role="button" tabindex="0" aria-label="Close">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- ✏️ config.js holds every piece of editable text — see that file first -->
    <script src="config.js" defer></script>
    <script src="script.js" defer></script>
    <script>
        document.getElementById('logout-btn').addEventListener('click', function () {
            try {
                sessionStorage.removeItem('sp_authenticated');
                localStorage.removeItem('sp_authenticated');
            } catch (e) {}
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
